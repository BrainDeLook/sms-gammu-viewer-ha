send_sms:
  name: Send SMS
  description: Sends an SMS via sms-gammu-gateway.
  fields:
    number:
      name: Phone number
      description: "Recipient number, e.g. +79001234567"
      required: true
      example: "+79001234567"
      selector:
        text:
    message:
      name: Message text
      description: SMS message body
      required: true
      example: "Hello!"
      selector:
        text:
          multiline: true

call:
  name: Call
  description: Dials a number via the modem voice AT interface. Requires voice port configured.
  fields:
    number:
      name: Phone number
      description: "Number to dial, e.g. +79001234567"
      required: true
      example: "+79001234567"
      selector:
        text:

hangup:
  name: Hang up
  description: Force-ends the current call.
